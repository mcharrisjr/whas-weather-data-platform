version: 2

models:
  - name: int_daily_observation
    description: Daily weather observations.
    columns:
      - name: observation_date
        description: Observation date.
        tests:
          - unique
          - not_null
      - name: high_temperature_f
        description: High temperature in Fahrenheit.
        tests:
          - not_null
      - name: low_temperature_f
        description: Low temperature in Fahrenheit.
        tests:
          - not_null
  - name: int_daily_forecast_accuracy
    description: Daily weather forecast accuracy.
    columns:
      - name: forecast_date
        description: Forecast date.
        tests:
          - not_null
      - name: residual_high_temperature_f
        description: Residual of high temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: abs_error_high_temperature_f
        description: Absolute error of high temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: residual_low_temperature_f
        description: Residual of low temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: abs_error_low_temperature_f
        description: Absolute error of low temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: forecast_horizon_days
        description: Forecast horizon in days.
        tests:
          - not_null

  - name: int_hourly_forecast_accuracy
    description: Hourly weather forecast accuracy.
    columns:
      - name: forecasted_for
        description: Forecasted for datetime.
        tests:
          - not_null
      - name: residual_temperature_f
        description: Residual of temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: abs_error_temperature_f
        description: Absolute error of temperature forecast in Fahrenheit.
        tests:
          - not_null
      - name: forecast_horizon_hours
        description: Forecast horizon in hours.
        tests:
          - not_null
