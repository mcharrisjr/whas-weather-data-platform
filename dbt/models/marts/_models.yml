version: 2

models:
  - name: dim_date
    description: Calendar date.
    columns:
      - name: calendar_date_key
        description: Calendar date primary, smart key.
        tests:
          - unique
          - not_null
      - name: calendar_date
        description: Calendar date.
        tests:
          - not_null
      - name: calendar_year
        description: Calendar year.
        tests:
          - not_null
      - name: calendar_month
        description: Calendar month.
        tests:
          - not_null
      - name: calendar_month_name
        description: Calendar month name.
        tests:
          - not_null
      - name: calendar_month_name_short
        description: Calendar month short name.
        tests:
          - not_null
      - name: season
        description: Season.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Winter, Spring, Summer, Fall]

  - name: dim_time_hourly
    description: Hourly time.
    columns:
      - name: hour_key
        description: Hour primary, smart key.
        tests:
          - unique
          - not_null
      - name: time_of_day
        description: Time of day.
        tests:
          - not_null
      - name: hour_24
        description: Hour number.
        tests:
          - unique
          - not_null
      - name: part_of_day
        description: Part of day.
        tests:
          - accepted_values:
              arguments:
                values: [Morning, Afternoon, Evening, Night]

  - name: fct_daily_forecast_observation
    description: Daily weather forecast and observation.
    columns:
      - name: calendar_date_key
        description: Calendar date foreign, smart key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: calendar_date_key
      - name: forecast_date
        description: Forecast date.
        tests:
          - not_null
      - name: observation_date
        description: Observation date.
        tests:
          - not_null
      - name: forecasted_high_temp_f
        description: Forecasted high temperature in Fahrenheit.
        tests:
          - not_null
      - name: observed_high_temp_f
        description: Observed high temperature in Fahrenheit.
        tests:
          - not_null
      - name: forecasted_low_temp_f
        description: Forecasted low temperature in Fahrenheit.
        tests:
          - not_null
      - name: observed_low_temp_f
        description: Observed low temperature in Fahrenheit.
        tests:
          - not_null

  - name: fct_hourly_forecast_observation
    description: Hourly weather forecast and observation.
    columns:
      - name: calendar_date_key
        description: Calendar date foreign, smart key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: calendar_date_key
      - name: forecasted_for
        description: Forecasted for datetime.
        tests:
          - not_null
      - name: observed_at
        description: Observed at datetime.
        tests:
          - not_null
      - name: forecasted_temp_f
        description: Forecasted temperature in Fahrenheit.
        tests:
          - not_null
      - name: observed_temp_f
        description: Observed temperature in Fahrenheit.
        tests:
          - not_null
      - name: hour_key
        description: Hour foreign, smart key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_time_hourly')
              field: hour_key
